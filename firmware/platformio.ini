[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_type = debug

; ESP32-S3-WROOM-1-N16R8
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi

build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_CAMERA_TASK_STACK_SIZE=8192
    ; esp32-camera 驱动源码（SDK 预编译版 cam_task 栈只有 2KB，VGA 下会溢出，
    ; 改从 src/esp32-camera 源码编译并加大栈）
    -Isrc/esp32-camera/driver/include
    -Isrc/esp32-camera/driver/private_include
    -Isrc/esp32-camera/conversions/include
    -Isrc/esp32-camera/conversions/private_include
    -Isrc/esp32-camera/sensors/private_include
    -Isrc/esp32-camera/target/private_include

; 只从源码编译 cam_hal.c（cam_task 栈大小所在文件），其余驱动文件
; 仍由 SDK 预编译库提供，避免全量源码引入 Arduino 日志宏兼容问题
build_src_filter =
    +<*>
    -<esp32-camera>
    +<esp32-camera/driver/cam_hal.c>

board_build.partitions = partitions_16MB.csv

; 使用原生 USB GPIO19/GPIO20 时启用
board_build.usb_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
